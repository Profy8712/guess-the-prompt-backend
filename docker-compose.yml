version: "3.9"

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: guess_the_prompt
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # В 99% случаев для db DNS не нужен, но если будут внешние запросы из контейнера, добавьте:
    # dns:
    #   - 8.8.8.8
    #   - 1.1.1.1

  backend:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/code
    working_dir: /code
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      - db
    dns:
      - 8.8.8.8
      - 1.1.1.1  # <-- DNS для выхода в интернет из контейнера!

volumes:
  postgres_data:
